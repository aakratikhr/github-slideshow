services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slideshow-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - slideshow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: slideshow-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - slideshow-network

networks:
  slideshow-network:
    driver: bridge
