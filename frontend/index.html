<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Slideshow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GitHub Slideshow Manager</h1>
            <p>Manage and view your presentation slides</p>
        </header>

        <main>
            <section class="controls">
                <button id="refreshBtn" class="btn btn-primary">Refresh Slides</button>
                <button id="addBtn" class="btn btn-success">Add New Slide</button>
            </section>

            <section id="slidesList" class="slides-list">
                <div class="loading">Loading slides...</div>
            </section>

            <section id="slideViewer" class="slide-viewer">
                <div class="viewer-header">
                    <h2>Slide Viewer</h2>
                    <button id="closeViewer" class="btn btn-secondary">Close</button>
                </div>
                <div id="currentSlide" class="current-slide"></div>
                <div class="viewer-controls">
                    <button id="prevBtn" class="btn">Previous</button>
                    <span id="slideCounter"></span>
                    <button id="nextBtn" class="btn">Next</button>
                </div>
            </section>
        </main>

        <div id="addSlideModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Add New Slide</h2>
                <form id="addSlideForm">
                    <div class="form-group">
                        <label for="slideTitle">Title:</label>
                        <input type="text" id="slideTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="slideContent">Content:</label>
                        <textarea id="slideContent" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="slideOrder">Order:</label>
                        <input type="number" id="slideOrder" min="1">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Slide</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
